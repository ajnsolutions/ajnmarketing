# .ai/queue/RUN_QUEUE.yaml
#
# The overnight/unattended task queue for this repository. Read
# docs/AI_OVERNIGHT_QUEUE.md before editing this file or running it.
#
# Every task below is executed by scripts/ai/run-queue.ts (npm run ai:queue),
# strictly in dependency order, one at a time. The queue NEVER merges,
# deploys, applies a production migration, changes a secret, or activates a
# production schedule — scripts/ai/validate-queue.ts refuses to run this
# file at all if any task or the safety block below asks for one of those.
#
# This is the first REAL, controlled queue (prepared on branch
# prepare-first-real-ai-queue). It replaces the two documentation-only
# example tasks with two real, low-risk, related AJN Marketing phases:
#
#   001 — Market Radar owner-managed persistence foundation (data model only)
#   002 — Market Radar owner-facing tracked competitors/benchmarks view,
#          which depends on 001's persistence layer actually existing
#
# Selected from .ai/ROADMAP.md's "Next" section (Wave III remaining scope),
# docs/project-magic/EXISTING_SYSTEM_AUDIT.md's Market Radar row ("Owner-
# facing competitor add/remove/prioritize control" and "Aspirational-
# benchmark tracking" are both flagged Needs Expansion / New Functionality),
# docs/project-magic/MARKET_RADAR.md's "Owner control" section, and
# docs/project-magic/WIREFRAMES.md's Market Radar wireframe — not invented.
# Both tasks are still status: pending only in the sense that a human (this
# preparation task) has reviewed and approved them for the queue; per
# docs/AI_OVERNIGHT_QUEUE.md, run a daytime dry run (`npm run ai:queue`,
# attended) before ever trusting this for an unattended overnight run — see
# .ai/HANDOFF.md for why that verification is still outstanding.
#
# Queue v2 (baseline-aware quality gates): the first daytime run of this
# queue surfaced a design flaw in v1's quality gate — it compared each
# task's lint/typecheck/unit-test run against a hard "must be perfectly
# clean" bar, so this repository's own documented, pre-existing baseline
# issues (.ai/OPEN_ITEMS.md) stopped the queue even when a task introduced
# zero regressions of its own. run-queue.ts now captures a QualitySnapshot
# of the repository once, before this run's first task begins, persists it
# to .ai/runs/<run>/baseline.json, and compares every task's own after-state
# against that SAME baseline — existing debt that's still present and
# unchanged never fails a task; anything newly broken always does, and gets
# a bounded number of automatic repair attempts (max_repair_attempts below)
# before the task is failed and the queue stops. See
# scripts/ai/qualityGates.ts and docs/AI_OVERNIGHT_QUEUE.md's "Queue v2"
# section for the full design.
#
# Reliability hardening (2026-08-02): this queue's actual first live,
# unattended run (evidence: .ai/runs/2026-08-02T065749882Z/, preserved) hit
# a real bug — every Claude tool call silently blocked on a permission
# approval no one was present to give, so the agent exited 0 having done
# zero work, and the adapter reported success anyway. Fixed in
# scripts/ai/adapters/claude.ts (permission bypass flag + response-body
# inspection instead of trusting exit code alone) and hardened further in
# run-queue.ts/qualityGates.ts (every subprocess now has an explicit
# timeout, QUEUE_STATUS.json writes are atomic, a crash mid-task still
# produces a normal run summary, and this whole run now has a wall-clock
# ceiling — max_run_duration_minutes below).
#
# Tasks 001 and 002 have since run for real, end to end, unattended (PRs
# #101 and #104, both merged), and a third infrastructure bug (TypeScript
# baseline non-determinism between the queue's baseline and comparison
# quality-gate captures — PR #105, merged) was found and fixed along the
# way. See .ai/DECISIONS.md ADR-0013 through ADR-0016 for the full history.
#
# Tasks 003-005 (added on branch prepare-market-radar-intelligence-tasks):
# the first real, human-reviewed MULTI-TASK sprint, extending Market Radar
# with the monitoring/detection layer that Tasks 001/002 explicitly deferred
# (docs/project-magic/MARKET_RADAR.md's "How it surfaces" section, and
# .ai/ROADMAP.md's Market Radar "Next" bullet). Dependency shape:
#
#   003 — Competitor Observation Engine (evidence model, confidence
#         scoring, persistence; no UI). Depends on 001 (persists rows that
#         reference lib/market-radar/'s entries by id) — deliberately NOT on
#         002, since it needs none of 002's UI files.
#   004 — Business Pulse Integration (verified observations, "What
#         Changed" section, evidence links, confidence filtering). Depends
#         on 003 (renders its output). A first, honest slice of the larger
#         Business Pulse vision (docs/project-magic/BUSINESS_PULSE.md),
#         scoped to Market Radar only — not the full Marketing Health +
#         Growth Momentum composition, which stays gated per .ai/ROADMAP.md
#         Wave IV ("depends on Waves I-III shipping real production signal
#         first").
#   005 — Weekly Executive Brief: Market Radar section (executive summary,
#         why it matters, suggested actions). Depends on 003 only (an
#         independent sibling of 004, not stacked on it — it extends the
#         existing lib/executive-briefing/ engine directly and does not
#         import anything 004 builds).
#
# This is the first time this queue has planned three tasks with a
# non-linear dependency graph (004 and 005 are parallel siblings, both
# depending on 003, not on each other) — branch_strategy: stacked below
# still applies per-task via each task's own depends_on, resolved through
# the same resolveDependencyBase() used for every prior stacked task (see
# .ai/DECISIONS.md ADR-0015); it does not require every task to form one
# single linear chain.
#
# estimated_duration_minutes (new, on tasks 003-005 below): informational
# only, for a human scheduling/reviewing an overnight run — NOT read or
# enforced by run-queue.ts or validate-queue.ts. The only duration ceiling
# actually enforced in code remains queue.max_run_duration_minutes above
# (the whole run's wall-clock budget) and each gate's own per-command
# timeout in qualityGates.ts. Do not assume this field does anything at
# runtime; if a future task wants it enforced, that is a separate,
# deliberate infrastructure change to run-queue.ts/queueTypes.ts, not
# something this field does implicitly just by being present.
#
# Task 006 (added 2026-08-08): the fourth and last of Market Radar's
# originally-planned "How it surfaces" points — Marketing Director
# recommendation evidence. Depends on 003 only, a sibling of 004/005, same
# non-linear shape as before. A would-be Task 007 (Seasonal Intelligence)
# was investigated alongside this one, specifically to prove a single
# `npm run ai:queue` invocation can complete a task and automatically
# continue to the next — the one queue behavior never yet observed for
# real (every real run to date processed exactly one task per invocation).
# Task 007 was explicitly NOT added: `lib/marketing-memory/seasonality.ts`
# and the actual owner-facing "seasonal hint" shown today are two
# architecturally disconnected mechanisms, and implementing real Seasonal
# Intelligence requires a genuine product decision no doc or code
# resolves — see `.ai/OPEN_ITEMS.md`'s "Task 007 stop condition" for full
# detail. Task 006 was implemented directly in this session rather than
# through this queue's own subprocess mechanism, since a single-task run
# would not have demonstrated the N->N+1 continuation the exercise was
# meant to prove. That continuation remains unproven — the next real test
# is whenever a second real, well-defined task exists to queue alongside a
# new one.

queue:
  name: "ajnmarketing-overnight-queue"
  project: "ajnmarketing"
  # sequential is the only supported mode in this first version — tasks run
  # one at a time, in dependency order, never in parallel.
  execution_mode: sequential
  # If a task fails, is ambiguous, or fails validation, the whole queue run
  # stops. This must stay true for any unattended/overnight run.
  stop_on_failure: true
  # independent: every task branches from base_branch, regardless of
  #   dependencies. Use this when tasks touch disjoint files and should each
  #   be independently reviewable/mergeable in any order.
  # stacked: a task with depends_on branches from its dependency's branch tip
  #   instead of base_branch, so its changes are actually present to build
  #   on. Use this when a later task genuinely needs an earlier task's files
  #   (exactly the case for the two tasks below — 002's UI is built directly
  #   against 001's new lib/market-radar/ persistence layer). This branching
  #   logic (determineBranchBase in scripts/ai/run-queue.ts) is implemented
  #   and unit-tested (unit-tests/ai-queue-run.test.ts) — see .ai/HANDOFF.md
  #   for what about this queue is still unverified (the Claude CLI
  #   adapter's live success path, not this branching mechanism).
  branch_strategy: stacked
  # The branch every task ultimately branches from (directly, or transitively
  # via branch_strategy: stacked). run-queue.ts refuses to start unless the
  # local repo is currently an up-to-date, clean checkout of this branch.
  base_branch: main
  default_agent: claude
  # Queue v2: how many times run-queue.ts will re-invoke the agent with a
  # narrow repair prompt when a task's quality-gate comparison finds new
  # regressions, before giving up and failing the task. Optional — defaults
  # to 3 (DEFAULT_MAX_REPAIR_ATTEMPTS in scripts/ai/queueTypes.ts) if unset.
  max_repair_attempts: 3
  # Reliability hardening: overall wall-clock ceiling (minutes) for one
  # `npm run ai:queue` invocation, independent of every individual
  # subprocess's own timeout — the last line of defense against an
  # unattended overnight run still going at 9am. Optional — defaults to 360
  # (6 hours; DEFAULT_MAX_RUN_DURATION_MINUTES in scripts/ai/queueTypes.ts)
  # if unset. Set explicitly here so the number is visible without reading
  # the source.
  max_run_duration_minutes: 360

safety:
  allow_merge: false
  allow_deploy: false
  allow_production_migrations: false
  allow_secret_changes: false
  allow_production_schedule_activation: false

tasks:
  - id: "001"
    name: "Market Radar: owner-managed competitor & benchmark persistence foundation"
    prompt: "prompts/001-market-radar-foundation.md"
    branch: "ai-queue/001-market-radar-foundation"
    agent: claude
    depends_on: []
    # This task adds a new, reviewable Supabase migration FILE (following
    # this repo's existing supabase/migrations/ convention) — it does not,
    # and must not, apply/run that migration against any database. See
    # AGENTS.md rule 13 and the prompt file's own "Standing rules" section
    # for why writing a migration is ordinary PR content while applying one
    # to production is a categorically separate, human-only action.
    # requires_migration stays false because nothing in this task requires
    # a migration to be applied for the task itself to complete.
    requires_migration: false
    requires_deployment: false
    requires_secret_change: false
    activates_production_schedule: false
    stop_if_ambiguous: true
    status: pending

  - id: "002"
    name: "Market Radar: owner-facing tracked competitors & benchmarks view"
    prompt: "prompts/002-market-radar-view.md"
    branch: "ai-queue/002-market-radar-view"
    agent: claude
    # Depends on 001: this task's UI is built directly against the
    # lib/market-radar/ persistence layer 001 adds. Under branch_strategy:
    # stacked (below), this task's branch is created from 001's own branch
    # tip so those files are actually present to build on.
    depends_on: ["001"]
    requires_migration: false
    requires_deployment: false
    requires_secret_change: false
    activates_production_schedule: false
    stop_if_ambiguous: true
    status: pending

  - id: "003"
    name: "Competitor Observation Engine: evidence model, confidence scoring, persistence"
    prompt: "prompts/003-competitor-observation-engine.md"
    branch: "ai-queue/003-competitor-observation-engine"
    agent: claude
    # Depends on 001 (not 002): persists rows that reference
    # lib/market-radar/'s entries by id (001), but touches no UI file 002
    # added. Under branch_strategy: stacked, this task's branch is created
    # from 001's own branch tip (or main, once 001 is merged — see
    # resolveDependencyBase(), .ai/DECISIONS.md ADR-0015).
    depends_on: ["001"]
    # Adds a new migration FILE (038_competitor_observations.sql, exact
    # number confirmed by the agent against the repo state at run time) —
    # writing it is ordinary task content; applying it is not (AGENTS.md
    # rule 13), so this stays false, matching Task 001's own precedent.
    requires_migration: false
    requires_deployment: false
    requires_secret_change: false
    activates_production_schedule: false
    stop_if_ambiguous: true
    # Informational only — see this file's header comment. Backend-only:
    # new migration, evidence/confidence model, scoring logic, persistence,
    # unit tests. No UI, no Playwright suite to run.
    estimated_duration_minutes: 45
    status: pending

  - id: "004"
    name: "Business Pulse Integration: verified observations, What Changed, evidence links, confidence filtering"
    prompt: "prompts/004-business-pulse-integration.md"
    branch: "ai-queue/004-business-pulse-integration"
    agent: claude
    # Depends on 003 only: renders lib/competitor-observations/ (003's
    # persistence layer) output. Does not depend on 002 or 005 — imports
    # neither. Branches from 003's own branch tip (or main, once 003 is
    # merged).
    depends_on: ["003"]
    requires_migration: false
    requires_deployment: false
    requires_secret_change: false
    activates_production_schedule: false
    stop_if_ambiguous: true
    # Informational only — see this file's header comment. New route +
    # component + nav link + unit tests + a Playwright spec (UI task, like
    # Task 002).
    estimated_duration_minutes: 45
    status: pending

  - id: "005"
    name: "Weekly Executive Brief: Market Radar section (executive summary, why it matters, suggested actions)"
    prompt: "prompts/005-weekly-executive-brief.md"
    branch: "ai-queue/005-weekly-executive-brief"
    agent: claude
    # Depends on 003 only, as an independent sibling of 004 (not stacked on
    # it) — extends the existing lib/executive-briefing/ engine directly
    # and imports nothing 004 builds. Branches from 003's own branch tip
    # (or main, once 003 is merged) — same base as 004, not from 004.
    depends_on: ["003"]
    requires_migration: false
    requires_deployment: false
    requires_secret_change: false
    activates_production_schedule: false
    stop_if_ambiguous: true
    # Informational only — see this file's header comment. Extends an
    # existing engine (new type/field + one new pure builder function +
    # wiring + a UI section in an existing component) rather than building
    # a new surface from scratch; smaller than Task 004 but still touches
    # rendered UI, so the Playwright suite is in scope.
    estimated_duration_minutes: 30
    status: pending

  - id: "006"
    name: "Integrate Market Radar Evidence into Marketing Director Recommendations"
    prompt: "prompts/006-marketing-director-evidence.md"
    branch: "ai-queue/006-marketing-director-evidence"
    agent: claude
    # Depends on 003 only (not 004 or 005 — genuine siblings, no shared
    # files). Reads lib/competitor-observations/persistence.ts and
    # display.ts (Task 003/004's read/filter helpers), not Task 004's own
    # UI or Task 005's Executive Brief work.
    depends_on: ["003"]
    requires_migration: false
    requires_deployment: false
    requires_secret_change: false
    activates_production_schedule: false
    stop_if_ambiguous: true
    # Informational only — see this file's header comment. Extends
    # lib/recommendation-presentation/ (new pure function + one new field +
    # wiring into two existing call sites + a UI block in an existing
    # component) rather than building a new surface from scratch — similar
    # shape and size to Task 005.
    estimated_duration_minutes: 30
    status: pending
