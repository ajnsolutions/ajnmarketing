# .ai/queue/RUN_QUEUE.yaml
#
# The overnight/unattended task queue for this repository. Read
# docs/AI_OVERNIGHT_QUEUE.md before editing this file or running it.
#
# Every task below is executed by scripts/ai/run-queue.ts (npm run ai:queue),
# strictly in dependency order, one at a time. The queue NEVER merges,
# deploys, applies a production migration, changes a secret, or activates a
# production schedule — scripts/ai/validate-queue.ts refuses to run this
# file at all if any task or the safety block below asks for one of those.
#
# This is the first REAL, controlled queue (prepared on branch
# prepare-first-real-ai-queue). It replaces the two documentation-only
# example tasks with two real, low-risk, related AJN Marketing phases:
#
#   001 — Market Radar owner-managed persistence foundation (data model only)
#   002 — Market Radar owner-facing tracked competitors/benchmarks view,
#          which depends on 001's persistence layer actually existing
#
# Selected from .ai/ROADMAP.md's "Next" section (Wave III remaining scope),
# docs/project-magic/EXISTING_SYSTEM_AUDIT.md's Market Radar row ("Owner-
# facing competitor add/remove/prioritize control" and "Aspirational-
# benchmark tracking" are both flagged Needs Expansion / New Functionality),
# docs/project-magic/MARKET_RADAR.md's "Owner control" section, and
# docs/project-magic/WIREFRAMES.md's Market Radar wireframe — not invented.
# Both tasks are still status: pending only in the sense that a human (this
# preparation task) has reviewed and approved them for the queue; per
# docs/AI_OVERNIGHT_QUEUE.md, run a daytime dry run (`npm run ai:queue`,
# attended) before ever trusting this for an unattended overnight run — see
# .ai/HANDOFF.md for why that verification is still outstanding.
#
# Queue v2 (baseline-aware quality gates): the first daytime run of this
# queue surfaced a design flaw in v1's quality gate — it compared each
# task's lint/typecheck/unit-test run against a hard "must be perfectly
# clean" bar, so this repository's own documented, pre-existing baseline
# issues (.ai/OPEN_ITEMS.md) stopped the queue even when a task introduced
# zero regressions of its own. run-queue.ts now captures a QualitySnapshot
# of the repository once, before this run's first task begins, persists it
# to .ai/runs/<run>/baseline.json, and compares every task's own after-state
# against that SAME baseline — existing debt that's still present and
# unchanged never fails a task; anything newly broken always does, and gets
# a bounded number of automatic repair attempts (max_repair_attempts below)
# before the task is failed and the queue stops. See
# scripts/ai/qualityGates.ts and docs/AI_OVERNIGHT_QUEUE.md's "Queue v2"
# section for the full design.
#
# Reliability hardening (2026-08-02): this queue's actual first live,
# unattended run (evidence: .ai/runs/2026-08-02T065749882Z/, preserved) hit
# a real bug — every Claude tool call silently blocked on a permission
# approval no one was present to give, so the agent exited 0 having done
# zero work, and the adapter reported success anyway. Fixed in
# scripts/ai/adapters/claude.ts (permission bypass flag + response-body
# inspection instead of trusting exit code alone) and hardened further in
# run-queue.ts/qualityGates.ts (every subprocess now has an explicit
# timeout, QUEUE_STATUS.json writes are atomic, a crash mid-task still
# produces a normal run summary, and this whole run now has a wall-clock
# ceiling — max_run_duration_minutes below). The fix has NOT yet been
# verified against a real `claude` invocation (no `claude` binary was on
# PATH in the sandbox that built the fix either) — see .ai/OPEN_ITEMS.md and
# docs/AI_OVERNIGHT_QUEUE.md before trusting an unattended run.

queue:
  name: "ajnmarketing-overnight-queue"
  project: "ajnmarketing"
  # sequential is the only supported mode in this first version — tasks run
  # one at a time, in dependency order, never in parallel.
  execution_mode: sequential
  # If a task fails, is ambiguous, or fails validation, the whole queue run
  # stops. This must stay true for any unattended/overnight run.
  stop_on_failure: true
  # independent: every task branches from base_branch, regardless of
  #   dependencies. Use this when tasks touch disjoint files and should each
  #   be independently reviewable/mergeable in any order.
  # stacked: a task with depends_on branches from its dependency's branch tip
  #   instead of base_branch, so its changes are actually present to build
  #   on. Use this when a later task genuinely needs an earlier task's files
  #   (exactly the case for the two tasks below — 002's UI is built directly
  #   against 001's new lib/market-radar/ persistence layer). This branching
  #   logic (determineBranchBase in scripts/ai/run-queue.ts) is implemented
  #   and unit-tested (unit-tests/ai-queue-run.test.ts) — see .ai/HANDOFF.md
  #   for what about this queue is still unverified (the Claude CLI
  #   adapter's live success path, not this branching mechanism).
  branch_strategy: stacked
  # The branch every task ultimately branches from (directly, or transitively
  # via branch_strategy: stacked). run-queue.ts refuses to start unless the
  # local repo is currently an up-to-date, clean checkout of this branch.
  base_branch: main
  default_agent: claude
  # Queue v2: how many times run-queue.ts will re-invoke the agent with a
  # narrow repair prompt when a task's quality-gate comparison finds new
  # regressions, before giving up and failing the task. Optional — defaults
  # to 3 (DEFAULT_MAX_REPAIR_ATTEMPTS in scripts/ai/queueTypes.ts) if unset.
  max_repair_attempts: 3
  # Reliability hardening: overall wall-clock ceiling (minutes) for one
  # `npm run ai:queue` invocation, independent of every individual
  # subprocess's own timeout — the last line of defense against an
  # unattended overnight run still going at 9am. Optional — defaults to 360
  # (6 hours; DEFAULT_MAX_RUN_DURATION_MINUTES in scripts/ai/queueTypes.ts)
  # if unset. Set explicitly here so the number is visible without reading
  # the source.
  max_run_duration_minutes: 360

safety:
  allow_merge: false
  allow_deploy: false
  allow_production_migrations: false
  allow_secret_changes: false
  allow_production_schedule_activation: false

tasks:
  - id: "001"
    name: "Market Radar: owner-managed competitor & benchmark persistence foundation"
    prompt: "prompts/001-market-radar-foundation.md"
    branch: "ai-queue/001-market-radar-foundation"
    agent: claude
    depends_on: []
    # This task adds a new, reviewable Supabase migration FILE (following
    # this repo's existing supabase/migrations/ convention) — it does not,
    # and must not, apply/run that migration against any database. See
    # AGENTS.md rule 13 and the prompt file's own "Standing rules" section
    # for why writing a migration is ordinary PR content while applying one
    # to production is a categorically separate, human-only action.
    # requires_migration stays false because nothing in this task requires
    # a migration to be applied for the task itself to complete.
    requires_migration: false
    requires_deployment: false
    requires_secret_change: false
    activates_production_schedule: false
    stop_if_ambiguous: true
    status: pending

  - id: "002"
    name: "Market Radar: owner-facing tracked competitors & benchmarks view"
    prompt: "prompts/002-market-radar-view.md"
    branch: "ai-queue/002-market-radar-view"
    agent: claude
    # Depends on 001: this task's UI is built directly against the
    # lib/market-radar/ persistence layer 001 adds. Under branch_strategy:
    # stacked (below), this task's branch is created from 001's own branch
    # tip so those files are actually present to build on.
    depends_on: ["001"]
    requires_migration: false
    requires_deployment: false
    requires_secret_change: false
    activates_production_schedule: false
    stop_if_ambiguous: true
    status: pending
